name: Advanced CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # === Step 1: Build ===
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build project
        run: |
          npm install
          npm run build || echo "No build step required."
      - name: Commit build result
        run: |
          git config --global user.name 'HmtWu'
          git config --global user.email 'hamiltonwu717@gmail.com'
          git commit -am "dist build" || echo "no changes"
          git push

  # === Step 2: Matrix Unit Tests with Coverage ===
  test-matrix:
    name: Matrix Unit Tests (Node 18 / 20)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    env:
      TEST_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Unit Tests with Coverage
        run: |
          echo "🧩 Running tests on Node v${{ matrix.node-version }} ($TEST_ENV)..."
          mkdir -p coverage
          echo "Statements   : 50%" > coverage/summary.txt
          echo "Branches     : 91%" >> coverage/summary.txt
          echo "Functions    : 93%" >> coverage/summary.txt
          echo "Lines        : 94%" >> coverage/summary.txt
          echo "❌ Simulated test failure on Node ${{ matrix.node-version }}"
          exit 1
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/

  # === Step 3: Verify Coverage Threshold ===
  check-coverage:
    name: Verify Coverage Threshold
    needs: test-matrix
    runs-on: ubuntu-latest
    outputs:
      pass: ${{ steps.coverage-check.outputs.pass }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-node-20
          path: ./coverage

      - name: Parse Coverage Summary
        id: coverage-check
        run: |
          COV=$(grep 'Statements' coverage/summary.txt | awk '{print $3}' | tr -d '%')
          echo "Detected coverage: $COV%"
          if [ "$COV" -ge 90 ]; then
            echo "✅ Coverage meets threshold."
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Coverage below threshold ($COV%). Skipping release."
            echo "pass=false" >> $GITHUB_OUTPUT
          fi

  # === Step 4: Generate JUnit Report ===
  junit-report:
    name: Generate JUnit Test Report
    needs: check-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Generate JUnit XML
        run: |
          mkdir -p reports
          echo '<testsuite name="unit-tests"><testcase classname="main" name="sample test"/></testsuite>' > reports/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml

  # === Step 5: Deploy to Staging (only if coverage ok) ===
  deploy-staging:
    name: Deploy to Staging
    needs: check-coverage
    if: needs.check-coverage.outputs.pass == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Deploying to staging..."
          gh release create "staging-$(date +%s)" --notes "Staging pre-production release"

  # === Step 6: Deploy to Production (manual approval) ===
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@v4
      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚢 Deploying to production..."
          gh release create "prod-$(date +%s)" --notes "Production release after manual approval"

  # === Step 7: Notifications & Auto Issue ===
  notify:
    name: Slack + Issue Notifications
    needs: [test-matrix, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack Notification
        if: success() || failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MSG="✅ All tests passed and deployment succeeded!"
          else
            MSG="❌ Tests or deployment failed in run ${{ github.run_id }}. Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$MSG\"}" "$SLACK_WEBHOOK_URL"

      - name: Create GitHub Issue if Tests Fail
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "❌ Automated Test Failure - ${{ github.run_id }}"
          content-filepath: ./coverage/summary.txt
          labels: bug, test-failure

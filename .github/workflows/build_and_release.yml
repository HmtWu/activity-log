name: Advanced CI/CD Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # === Step 1: Build ===
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build project
        run: |
          npm install
          npm run build || echo "No build step required."
      - name: Commit build result
        run: |
          git config --global user.name 'HmtWu'
          git config --global user.email 'hamiltonwu717@gmail.com'
          git commit -am "dist build" || echo "no changes"
          git push

  # === Step 2: Matrix Unit Tests with Coverage ===
  test-matrix:
    name: Matrix Unit Tests (Node 18 / 20)
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    env:
      TEST_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm install
          npm install --save-dev jest

      - name: Run Unit Tests with Coverage
        run: |
          echo "🧩 Running tests on Node v${{ matrix.node-version }} ($TEST_ENV)..."
          npx jest --coverage --coverageReporters=text-summary --coverageReporters=lcov

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/

  # === Step 3: Verify Coverage Threshold ===
  check-coverage:
    name: Verify Coverage Threshold
    needs: test-matrix
    runs-on: ubuntu-latest
    outputs:
      pass: ${{ steps.coverage-check.outputs.pass }}
    steps:
      - name: Download coverage report from Node 20
        uses: actions/download-artifact@v4
        with:
          name: coverage-node-20
          path: ./coverage

      - name: Show downloaded files
        run: ls -R ./coverage

      - name: Parse Coverage Summary
        id: coverage-check
        run: |
          if [ ! -f "./coverage/coverage-summary.json" ]; then
            echo "❌ coverage-summary.json not found!"
            echo "pass=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 用 NodeJS 讀取 JSON 內容
          COV=$(node -pe "require('./coverage/coverage-summary.json').total.statements.pct")
          echo "Detected coverage: $COV%"

          # 判斷是否達到門檻 (90%)
          if (( $(echo "$COV >= 90" | bc -l) )); then
            echo "✅ Coverage meets threshold."
            echo "pass=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Coverage below threshold ($COV%). Skipping release."
            echo "pass=false" >> $GITHUB_OUTPUT
          fi
  # === Step 4: Generate JUnit Report ===
  junit-report:
    name: Generate JUnit Test Report
    needs: check-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Generate JUnit XML
        run: |
          mkdir -p reports
          echo '<testsuite name="unit-tests"><testcase classname="main" name="sample test"/></testsuite>' > reports/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml

  # === Step 5: Deploy to Staging (only if coverage ok) ===
  deploy-staging:
    name: Deploy to Staging
    needs: check-coverage
    if: needs.check-coverage.outputs.pass == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Create Staging Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Deploying to staging..."
          gh release create "staging-$(date +%s)" --notes "Staging pre-production release"

  # === Step 6: Deploy to Production (manual approval) ===
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases
    steps:
      - uses: actions/checkout@v4
      - name: Create Production Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚢 Deploying to production..."
          gh release create "prod-$(date +%s)" --notes "Production release after manual approval"

  notify-slack:
    name: Slack Notifications
    needs: [test-matrix, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MSG="✅ All tests passed and deployment succeeded!"
          else
            MSG="❌ Some jobs failed in run ${{ github.run_id }}!"
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"$MSG\"}" "$SLACK_WEBHOOK_URL"

  create-issue:
    name: Auto Create Issue on Failure
    needs: [test-matrix, deploy-production]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Try to download coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-node-20
          path: ./coverage

      - name: Fallback coverage summary
        run: |
          if [ ! -f ./coverage/summary.txt ]; then
            mkdir -p coverage
            echo "⚠️ Coverage report missing. Test job failed before upload." > coverage/summary.txt
          fi

      - uses: peter-evans/create-issue-from-file@v5
        with:
          title: "❌ Automated Test Failure - ${{ github.run_id }}"
          content-filepath: ./coverage/summary.txt
          labels: bug, test-failure
